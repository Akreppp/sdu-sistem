    :root {
        --input-padding-x: 3.3rem;
        --input-padding-y: 0.75rem
    }

    .login {
        min-height: 100vh
    }

    @media only screen and (max-width:767px) {
        .login {
            background-image: var(--sf-img-24);
            background-repeat: repeat;
            background-size: auto;
            background-color: #fff;
            background-position-y: center
        }
    }

    .bg-image {
        background-image: var(--sf-img-24);
        background-repeat: repeat;
        background-size: auto;
        background-color: #fff;
        background-position-y: center
    }

    .sol-alan {
        width: 100%
    }

    .sol-alan .logo>* {
        display: block
    }

    .sol-alan .logo>h2 {
        padding-top: 1rem;
        font-family: "Roboto Condensed", sans-serif;
        font-weight: 700;
        font-size: 1.7rem;
        color: #666666;
        text-align: center
    }

    .sol-alan .logo>span {
        font-family: "Roboto Condensed", sans-serif;
        font-weight: 300;
        color: #666666;
        font-size: 1.5rem
    }

    .sol-alan .logo img {
        width: 15rem;
        padding: 1rem 0
    }

    .btn-login {
        font-size: 0.9rem;
        letter-spacing: 0.05rem;
        padding: 0.75rem 1rem;
        color: #E02020;
        background: #FFFFFF;
        box-shadow: 2px 2px 12px 0 rgba(109, 114, 120, 0.10);
        border-radius: 2px;
        text-align: center
    }

    .extra-login {
        display: flex;
        height: 40px;
        align-items: center;
        color: #646464;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: -.28px;
        font-family: "Manrope", sans-serif
    }

    .extra-login:before {
        flex: 0;
        margin-right: 0
    }

    .extra-login:after {
        margin-left: 32px
    }

    .form-control:focus {
        color: #495057;
        background-color: #fff;
        border-color: #ced4da;
        outline: 0;
        box-shadow: none
    }

    .btn-login:hover {
        color: #E02020
    }

    .form-group {
        margin-bottom: 1rem;
        font-family: "Manrope", sans-serif
    }

    .form-group>input {
        padding: var(--input-padding-y) var(--input-padding-x);
        height: auto
    }

    .cbx {
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer
    }

    .cbx span {
        display: inline-block;
        vertical-align: middle;
        transform: translate3d(0, 0, 0)
    }

    .cbx span:first-child {
        position: relative;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        transform: scale(1);
        vertical-align: middle;
        border: 1px solid #B9B8C3;
        transition: all .2s ease
    }

    .cbx span:first-child:before {
        content: "";
        width: 100%;
        height: 100%;
        background: #E02020;
        display: block;
        transform: scale(0);
        opacity: 1;
        border-radius: 50%;
        transition-delay: .2s
    }

    .cbx span:last-child {
        margin-left: 8px
    }

    .cbx span:last-child:after {
        content: "";
        position: absolute;
        top: 8px;
        left: 0;
        height: 1px;
        width: 100%;
        background: #B9B8C3;
        transform-origin: 0 0;
        transform: scaleX(0)
    }

    .cbx:hover span:first-child {
        border-color: #E02020
    }

    .inp-cbx:checked+.cbx span:first-child {
        border-color: #E02020;
        background: #E02020;
        animation: check .6s ease
    }

    .inp-cbx:checked+.cbx span:first-child:before {
        transform: scale(2.2);
        opacity: 0;
        transition: all .6s ease
    }

    @keyframes check {
        50% {
            transform: scale(1.2)
        }
    }

    .form-group i {
        top: 50%;
        left: 1rem;
        transform: translateY(-50%);
        color: rgba(0, 0, 0, .1);
        font-size: 1.2rem
    }

    .form-group input,
    .form-group input:focus {
        box-shadow: 2px 2px 12px 0 rgba(109, 114, 120, 0.10);
        outline: none;
        border: none;
        margin-bottom: 2rem
    }

    .beni-hatirla {
        font-family: "Manrope", sans-serif;
        font-weight: 300;
        font-size: .85rem;
        color: rgba(0, 0, 0, 0.5)
    }

    .parolami-unuttum {
        font-family: "Manrope", sans-serif;
        font-weight: 300;
        font-size: .85rem;
        text-decoration: none;
        color: rgba(0, 0, 0, 0.5)
    }

    .edevlet {
        font-family: "Manrope", sans-serif;
        font-weight: 300;
        font-size: .9rem
    }

    .edevlet span {
        padding-left: 1rem
    }

    @media only screen and (max-width:767px) {
        .sol-alan {
            display: none
        }
    }

    @media only screen and (min-width:768px) {
        .btn-login {
            width: 30%
        }
    }

    @media only screen and (max-width:767px) {
        .logo img {
            width: 7rem;
            height: auto
        }

        .form-group input {
            font-size: .8rem
        }

        .extra-login {
            font-size: .9rem
        }
    }

    .footer {
        width: 100%;
        text-align: right;
        bottom: 1rem;
        right: 1rem
    }

    .footer a {
        width: 100%;
        text-align: right;
        text-decoration: none;
        color: rgba(0, 0, 0, 0.5);
        font-family: "Manrope", sans-serif;
        font-size: .8rem
    }

    .footer a:hover {
        color: #E02020
    }

    @media only screen and (max-width:767px) {
        .footer {
            text-align: center;
            right: 0
        }

        .footer a {
            text-align: center
        }
    }
</style>
